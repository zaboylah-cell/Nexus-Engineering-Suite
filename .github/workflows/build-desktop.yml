name: Build desktop installers and portable packages
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build Windows installer and portable EXE
        if: matrix.platform == 'windows'
        run: npm run build:win
      - name: Build macOS DMG and ZIP app bundle
        if: matrix.platform == 'macos'
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: BRO-Nexus-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
