name: Build desktop downloads
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nexus-windows
            file: dist/NEXUS-Engineering-Suite.exe
          - os: ubuntu-latest
            artifact: nexus-linux
            file: dist/NEXUS-Engineering-Suite
          - os: macos-latest
            artifact: nexus-macos
            file: dist/NEXUS-Engineering-Suite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --onefile --windowed --name NEXUS-Engineering-Suite desktop/nexus.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
